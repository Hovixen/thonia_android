<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Account Reconciliation</title>
<style>
:root{--g:#0b4a2e;--g2:#17704a;--on:#fff;--gl:#dcf0e5;--bg:#f1f4f2;--card:#fff;--in:#e6eae8;--tx:#0e1913;--mu:#4a5851;--bd:#c3cfc8;--rd:#a3241a;--onr:#fff;--am:#7d4a00;--amb:#f6e2b8;--hx:#fff;--hm:#d3efe0;--fs:1.2;--fn:1.2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="hc"]{--g:#003d20;--g2:#00582f;--gl:#d2eedd;--bg:#fff;--card:#fff;--in:#edefee;--tx:#000;--mu:#222;--bd:#000;--rd:#8f0000;--am:#5e3500;--amb:#ffe6a6;--hm:#fff}
:root[data-theme="dark"]{--g:#0b3d28;--g2:#5fd9a0;--on:#04200f;--gl:#173a2a;--bg:#0e1411;--card:#17201b;--in:#222d27;--tx:#eef5f0;--mu:#b3c2b9;--bd:#34443c;--rd:#ff9d92;--onr:#2a0905;--am:#f0c070;--amb:#3a2c0e;--hm:#c9ebd9;color-scheme:dark}
:root[data-theme="hcd"]{--g:#003d20;--g2:#6dffb0;--on:#000;--gl:#0b3a24;--bg:#000;--card:#000;--in:#1b1b1b;--tx:#fff;--mu:#e6e6e6;--bd:#c8c8c8;--rd:#ff8a80;--onr:#000;--am:#ffd54f;--amb:#3d2f00;--hm:#fff;color-scheme:dark}
html{-webkit-text-size-adjust:100%}html[data-bold] body{font-weight:600}
[data-theme^=hc] .card,[data-theme^=hc] .c,[data-theme^=hc] nav,[data-theme^=hc] .gb{border-width:2px}[data-theme^=hc] input,[data-theme^=hc] select{border:2px solid var(--bd)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--g2);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips.v{flex-direction:column}.chips .chip{padding:10px 14px;min-height:calc(44px*var(--fs));display:flex;align-items:center}
.hi{flex-wrap:wrap}.gs h1{overflow-wrap:anywhere}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-size:calc(15px*var(--fs));line-height:1.45;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
#main{flex:1;overflow-y:auto;padding-bottom:8px}
.hero{background:var(--g);color:var(--hx);padding:16px 16px 56px;border-radius:0 0 26px 26px}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}
.logo{width:40px;height:40px;border-radius:12px;background:var(--hx);color:var(--g);display:grid;place-items:center;font-weight:800;font-size:calc(20px*var(--fs))}
small,.mu{color:var(--mu);font-size:calc(12.5px*var(--fs))}.hero small{color:var(--hm)}
.pad{padding:0 16px}
.gs{margin:-40px 16px 14px;background:var(--g);color:var(--hx);border-radius:20px;padding:18px;border:1px solid #ffffff22;box-shadow:0 8px 22px #0f5a3a40}
.gs small{color:var(--hm)}.gs h1{margin:4px 0 6px;font-size:calc(34px*var(--fs));letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 16px 12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}.stat .card{margin:0}.stat b{font-size:calc(22px*var(--fs));display:block}
button{font:inherit;border:0;border-radius:14px;padding:14px;background:var(--g2);color:var(--on);font-weight:700;width:100%;cursor:pointer}
button.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.s{width:auto;padding:10px 14px}
.btns{display:grid;gap:10px;margin:0 16px}
h2{font-size:calc(19px*var(--fs));margin:16px 16px 10px}
input,select{font:inherit;width:100%;background:var(--in);color:var(--tx);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;min-height:calc(44px*var(--fs))}
input:focus,select:focus{outline:0;border-color:var(--g2)}input[readonly]{opacity:.75}
label{display:block;font-size:calc(12px*var(--fs));color:var(--mu);font-weight:600}label input{margin-top:4px;font-size:calc(16px*var(--fs));color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin:0 16px 10px;overflow:hidden}
.c.w{border-color:var(--rd)}.c.m .ch{border-left:4px solid var(--am)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 14px;cursor:pointer}
.ch b{display:block}.r{text-align:right}.r b{color:var(--g2);font-size:calc(16px*var(--fs))}.chev{font-size:calc(10px*var(--fs));color:var(--mu)}
.bd{padding:0 14px 14px}.bd .g2{margin-bottom:10px}
.tag[hidden],.warn[hidden]{display:none}.tag{display:inline-block;font-size:calc(11px*var(--fs));font-weight:700;border-radius:99px;padding:2px 8px;background:var(--gl);color:var(--g2);margin-left:6px}
.tag.m{color:var(--am);background:var(--amb)}.tag.w{color:var(--onr);background:var(--rd)}
.warn{color:var(--rd);font-size:calc(12.5px*var(--fs));font-weight:600;margin:0 0 8px}.note{background:var(--in);border-radius:10px;padding:8px 10px;font-size:calc(12px*var(--fs));color:var(--mu)}
.gb{position:sticky;bottom:0;margin:10px 0 0;padding:10px 16px;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;gap:12px}
.gb div{flex:1}.gb b{font-size:calc(20px*var(--fs));color:var(--g2)}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--bd)}
nav a{padding:9px 1px 10px;overflow-wrap:anywhere;text-align:center;font-size:calc(12px*var(--fn));color:var(--mu);cursor:pointer;font-weight:600}nav a i{display:block;font-style:normal;font-size:calc(20px*var(--fn));line-height:1.2}
nav a.on{color:var(--g2)}
.bar{height:8px;background:var(--in);border-radius:9px;margin-top:6px;overflow:hidden}.bar span{display:block;height:100%;background:var(--g2)}
.sum{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}.sum:last-child{border:0}
.hi{display:flex;gap:10px;align-items:center;padding:12px 14px}.hi.sel{outline:2px solid var(--g2)}
.chip{display:inline-block;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 12px;font-size:calc(12.5px*var(--fs));font-weight:600;cursor:pointer}.chip.on{background:var(--g2);color:var(--on)}
#tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--g);color:var(--hx);padding:11px 16px;border-radius:12px;font-weight:600;display:none;max-width:90%;z-index:5}
#md{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:6;padding:20px}
#md div{background:var(--card);border-radius:18px;padding:18px;max-width:340px;width:100%}
@media print{nav,.btns,.gb{display:none}}
</style></head><body>
<div id="app"><div id="main"></div>
<nav id="nav"></nav></div><div id="tt"></div><div id="md"><div><p id="mq"></p><div class="g2"><button class="o" onclick="md(0)">Cancel</button><button id="my" style="background:var(--rd);color:var(--onr)">Confirm</button></div></div></div>
<script>
/*CALC*/
const S=[['DONUTS',250,'','',29,10],['EGGBUNS',500,'','',24,''],['MEAT PIE',800,'','',24,6],['CHICKEN PIE',1000,'','','',''],['SAUSAGE ROLL',250,'','',16,10],['FRANK ROLL',500,'','',10,''],['MILK DONUT',500,'','',6,''],['BUNS',100,'','',110,''],['FISH ROLLS',100,'','',90,''],['SCOTCHED EGGS',500,'','',4,''],['CUPCAKES',300,'','',2,1],['PLANTAIN',50,'','',90,42],['CHICKEN A',1500,'','',3,''],['CHICKEN B',2000,'','',10,2],['CHICKEN C',2500,'','','',''],['CHICKEN D',1000,'','','',''],['FISH',1000,'','',7,3],['SALAD',500,'','','',''],['BREAD 1',400,'','',6,5],['BREAD 2',1200,'','',1,''],['JOLLOF RICE',400,8884,'','',2270,2242,150],['FRIED RICE',400,2874,'','',256,848,150],['OFADA RICE',500,2044,'','',806,1226,150],['BEANS',200,5650,'','',444,2126,150],['MEAT',200,'','',45,17],['EGG',300,'','',6,1],['PONMO',200,'','',12,5],['ASSORTED',200,'','',6,4],['SPAGHETTI',200,872,'','','',122,100],['EBA',400,'','',8,5],['FUFU',400,'','','','']];
const I=S.map(a=>({n:a[0],p:a[1],o:a[2],a:a[3],t:a[4],l:a[5],k:a[6]||0,d:a[7]||0}));
const num=v=>v===''?0:+v;
const tot=i=>i.k?(i.o===''?0:i.o-i.k)+(i.a===''?0:i.a-i.k):num(i.t);
const sal=i=>i.k?(tot(i)-num(i.l))/i.d*i.p:(tot(i)-num(i.l))*i.p;
const grand=()=>I.reduce((s,i)=>s+sal(i),0);
/*END*/
const base=I.map(i=>i.p);
const $=s=>document.querySelector(s),N=n=>'₦'+(+n).toLocaleString('en-NG',{maximumFractionDigits:2});
const r=(a,b)=>Array.from({length:b-a+1},(_,k)=>a+k);
const C=[['Snacks & pastries',r(0,11)],['Chicken & fish',r(12,16)],['Salad & bread',r(17,19)],['Rice, beans & swallow',[...r(20,23),28,29,30]],['Meat, egg & sides',r(24,27)],['Added items',[]]];
const rec=i=>tot(i)>0||i.l!=='',miss=i=>i.k?(i.o===''&&i.a===''):i.t==='',bad=i=>num(i.l)>tot(i);
let ST={days:{}};const LS='recon_v1';
try{ST=JSON.parse(localStorage.getItem(LS))||ST}catch(e){}
ST.days=ST.days||{};
const ent=()=>I.map(i=>[i.o,i.a,i.t,i.l]);
const newest=()=>!orig||orig>=Object.keys(ST.days).reduce((a,b)=>a>b?a:b,'');
function P(){try{localStorage.setItem(LS,JSON.stringify({days:ST.days,items:I.map((i,x)=>({n:i.n,p:base[x],k:i.k,d:i.d})),cur:{date,att,e:ent(),p:I.map(i=>i.p),o:orig}}))}catch(e){}}
function ld(d){const r=ST.days[d];I.forEach((i,x)=>{const e=(r&&r.e[x])||['','','',''];i.o=e[0];i.a=e[1];i.t=e[2];i.l=e[3];i.p=(r&&r.p&&r.p[x]!=null)?r.p[x]:base[x]});att=r?r.a:''}
const open=new Set();let tab='home',date='2026-11-16',orig='',att='',adm=false,q='',fa='All',cmp=[];
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const T=[['home','⌂','Dashboard'],['rec','✎','Reconcile'],['rep','▤','Reports'],['his','↺','History'],['set','⚙','Settings']];
function toast(m){const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function md(m,fn){$('#md').style.display=m?'grid':'none';if(m){$('#mq').textContent=m;$('#my').onclick=()=>{md(0);fn()}}}
function go(t){tab=t;render();$('#main').scrollTop=0}
function render(){$('#nav').innerHTML=T.map(t=>`<a class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</a>`).join('');$('#main').innerHTML={home,rec:recon,rep:report,his:hist,set:sett}[tab]()}
function home(){const n=I.filter(rec).length;return `<div class="hero"><div class="row"><div class="logo">₦</div><div><b>Daily Account Reconciliation</b><br><small>Snacks & food sales</small></div></div><div style="margin-top:16px"><small>Today’s date</small><br><b>${fd(date)}</b></div><div style="margin-top:8px"><small>Attendant</small><br><b>${att||'Not set yet'}</b></div></div>
<div class="gs"><small>TODAY’S GRAND SALES</small><h1 id="hg">${N(grand())}</h1><small>Sum of total sales for all food items</small></div>
<div class="stat"><div class="card"><small>Items recorded</small><b>${n}</b></div><div class="card"><small>Items listed</small><b>${I.length}</b></div></div>
<div class="btns"><button onclick="md('Start a new reconciliation? All entered counts will be cleared.',nw)">＋ Start new reconciliation</button><button class="o" onclick="go('his')">View previous records</button><button class="o" onclick="go('rep')">View daily sales report</button></div>`}
function nw(){I.forEach((i,x)=>{i.o=i.a=i.t=i.l='';i.p=base[x]});att='';orig='';P();go('rec');toast('New reconciliation started')}
function fld(i,x,k,l,ro,v){return `<label>${l}<input type="number" inputmode="decimal" min="0" step="any" ${ro?'readonly':''} data-x="${x}" data-k="${k}" ${ro?`id="t${x}"`:''} value="${v!==undefined?v:i[k]}"></label>`}
function card(i,x){const sp=i.k,o=open.has(x);return `<div class="c ${bad(i)?'w':''} ${miss(i)?'m':''}" id="c${x}"><div class="ch" onclick="tg(${x})"><div><b>${i.n}</b><small><span id="pp${x}">${N(i.p)}</span>${sp?' per '+i.d+' units':' each'}<span class="tag m" id="m${x}" ${miss(i)?'':'hidden'}>No entry</span><span class="tag w" id="k${x}" ${bad(i)?'':'hidden'}>Check</span></small></div><div class="r"><b id="s${x}">${N(sal(i))}</b><br><span class="chev">${o?'▲ Hide':'▼ Edit'}</span></div></div>${o?`<div class="bd"><p class="warn" id="w${x}" ${bad(i)?'':'hidden'}>⚠ Leftovers exceed total quantity</p><div class="g2">${fld(i,x,'p','Unit price (₦)')}${fld(i,x,'o','Open count')}</div><div class="g2">${fld(i,x,'a','Additions')}${sp?fld(i,x,'t','Total (calculated)',1,tot(i)):fld(i,x,'t','Total')}</div>${fld(i,x,'l','Leftovers')}<p class="note">${sp?`Total = (Open − ${i.k}) + (Additions − ${i.k}); blank cells count as 0.<br>Sales = (Total − Leftovers) ÷ ${i.d} × Price`:'Sales = (Total − Leftovers) × Unit price'}</p></div>`:''}</div>`}
function tg(x){const m=$('#main'),was=open.has(x),prev=[...open],t0=$('#c'+x).getBoundingClientRect().top;open.clear();if(!was)open.add(x);prev.forEach(y=>{if(y!=x){const e=$('#c'+y);if(e)e.outerHTML=card(I[y],y)}});$('#c'+x).outerHTML=card(I[x],x);const e=$('#c'+x);if(!was&&prev.length)m.scrollTop+=e.getBoundingClientRect().top-t0;if(!was){const r=e.getBoundingClientRect(),mr=m.getBoundingClientRect(),gb=$('.gb'),ov=r.bottom-(mr.bottom-(gb?gb.offsetHeight:0));if(ov>0)m.scrollTop+=Math.min(ov,Math.max(0,r.top-mr.top-8))}}
function recon(){return `<h2>Daily Account Reconciliation</h2><div class="card"><div class="g2"><label>Date<input type="date" id="dt" value="${date}"></label><label>Attendant<input id="at" placeholder="Enter name" value="${att}"></label></div><div class="row sb" style="margin-top:10px"><span class="chip ${adm?'on':''}" onclick="adm=!adm;render()">Admin mode: ${adm?'on':'off'}</span><small id="wc"></small></div>${adm?`<div class="g2" style="margin-top:10px"><label>New item<input id="ni" placeholder="Item name"></label><label>Unit price (₦)<input id="np" type="number" min="0" inputmode="decimal"></label></div><button class="s" style="margin-top:10px" onclick="addI()">＋ Add food item</button>`:''}</div>${I.map(card).join('')}<div class="gb"><div><small>Grand sales</small><br><b id="gt">${N(grand())}</b></div><button class="s" onclick="save()">Save</button></div>`}
function addI(){const n=$('#ni').value.trim().toUpperCase(),p=+$('#np').value;if(!n||!(p>=0)||$('#np').value==='')return toast('Enter a name and unit price');I.push({n,p,o:'',a:'',t:'',l:'',k:0,d:0});base.push(p);C[5][1].push(I.length-1);P();render()}
function save(){if(!date)return toast('Pick a date first');if(ST.days[date]&&date!==orig)return md('A record for '+fd(date)+' already exists. Replace it?',sv);sv()}
function sv(){if(orig&&orig!==date)delete ST.days[orig];ST.days[date]={a:att,e:ent(),g:grand(),n:I.filter(rec).length,p:I.map(i=>i.p)};orig=date;P();const w=I.filter(bad).length;toast(w?`Saved with ${w} warning${w>1?'s':''} · ${N(grand())}`:`✓ Reconciliation saved · ${N(grand())}`)}
function upd(x){const i=I[x];$('#s'+x).textContent=N(sal(i));const pp=$('#pp'+x);if(pp)pp.textContent=N(i.p);const t=$('#t'+x);if(t)t.value=tot(i);const c=$('#c'+x);c.classList.toggle('w',bad(i));c.classList.toggle('m',miss(i));$('#m'+x).hidden=!miss(i);$('#k'+x).hidden=!bad(i);const w=$('#w'+x);if(w)w.hidden=!bad(i);gt();P()}
function gt(){const g=$('#gt');if(g)g.textContent=N(grand());const w=$('#wc');if(w){const n=I.filter(bad).length,m=I.filter(miss).length;w.textContent=`${n?'⚠ '+n+' warning'+(n>1?'s · ':' · '):''}${m} without entry`}}
function report(){const g=grand(),n=I.filter(rec).length;return `<h2>Daily Sales Report</h2><div class="card"><div class="sum"><span class="mu">Date</span><b>${fd(date)}</b></div><div class="sum"><span class="mu">Attendant</span><b>${att||'Not set'}</b></div><div class="sum"><span class="mu">Items recorded</span><b>${n} of ${I.length}</b></div></div>
<div class="card"><b>Sales by category</b>${C.filter(c=>c[1].length).map(c=>{const s=c[1].reduce((a,x)=>a+sal(I[x]),0);return `<div style="margin-top:12px"><div class="row sb"><span>${c[0]}</span><b>${N(s)}</b></div><div class="bar"><span style="width:${g>0?Math.max(0,s/g*100):0}%"></span></div></div>`}).join('')}</div>
<div class="gs" style="margin-top:0"><small>GRAND SALES FOR THE DAY</small><h1>${N(g)}</h1></div>
<div class="btns"><button onclick="expPdf()">Share as PDF</button><button class="o" onclick="expCsv()">Share as CSV (opens in Excel)</button></div>`}
function rows(){const D=Object.keys(ST.days).sort().reverse().map(d=>({d,a:ST.days[d].a||'—',g:ST.days[d].g}));if(!ST.days[date])D.unshift({d:date,a:att||'—',g:grand(),live:1});return D.filter(h=>(fa=='All'||h.a==fa)&&(!q||(h.d+' '+fd(h.d)).toLowerCase().includes(q.toLowerCase())))}
function hl(){const R=rows();let h=R.map(h=>`<div class="c hi ${cmp.includes(h.d)?'sel':''}" style="margin:0 16px 10px"><div style="flex:1" onclick="pk('${h.d}')"><b>${fd(h.d)}</b>${h.live?'<span class="tag">Today</span>':''}<br><small>${h.a}</small></div><b style="color:var(--g2)">${N(h.g)}</b><button class="s o" onclick="op('${h.d}')">Open</button>${h.live?'':`<span onclick="dl('${h.d}')" style="cursor:pointer">🗑</span>`}</div>`).join('')||'<p class="mu pad">No records match.</p>';const A=R.find(h=>h.d==cmp[0]),B=R.find(h=>h.d==cmp[1]);if(A&&B){const df=B.g-A.g;h=`<div class="card"><b>Comparison</b><div class="sum"><span>${fd(A.d)}</span><b>${N(A.g)}</b></div><div class="sum"><span>${fd(B.d)}</span><b>${N(B.g)}</b></div><div class="sum"><span class="mu">Difference</span><b style="color:${df<0?'var(--rd)':'var(--g2)'}">${df<0?'−':'+'}${N(Math.abs(df))}</b></div></div>`+h}else h=`<p class="mu pad" style="margin:0 0 8px">Tap two days to compare their sales.</p>`+h;$('#hl').innerHTML=h}
function pk(d){cmp=cmp.includes(d)?cmp.filter(x=>x!=d):[...cmp.slice(-1),d];hl()}
function op(d){if(ST.days[d]){if(d!=date){date=d;ld(d)}orig=d;P()}go('rec')}
function dl(d){md('Delete this reconciliation? This cannot be undone.',()=>{delete ST.days[d];cmp=cmp.filter(x=>x!=d);P();hl();toast('Deleted')})}
function hist(){setTimeout(hl,0);return `<h2>History</h2><div class="card"><div class="g2"><label>Search by date<input id="hq" placeholder="e.g. Nov or 14" value="${q}"></label><label>Attendant<select id="hf">${['All',...new Set(Object.values(ST.days).map(x=>x.a).filter(Boolean))].map(a=>`<option ${a==fa?'selected':''}>${a}</option>`).join('')}</select></label></div><small>Saved days are stored on this phone.</small></div><div id="hl"></div>`}
const f2=n=>(+n).toLocaleString('en-US',{maximumFractionDigits:2}),q2=v=>'"'+String(v).replace(/"/g,'""')+'"';
async function out(name,mime,txt){const cp=window.Capacitor,PL=cp&&cp.Plugins;if(cp&&cp.isNativePlatform&&cp.isNativePlatform()&&PL&&PL.Filesystem&&PL.Share){try{const r=await PL.Filesystem.writeFile({path:name,data:btoa(unescape(encodeURIComponent(txt))),directory:'CACHE'});await PL.Share.share({title:name,url:r.uri})}catch(e){toast('Could not share: '+(e.message||e))}return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;a.click();toast('File downloaded (if your browser allows it)')}
function expCsv(){let c=`Date,${date}\nAttendant,${q2(att)}\nSNACKS/FOOD,UNIT PRICE,OPEN COUNT,ADDITIONS,TOTAL,LEFTOVERS,TOTAL SALES\n`;I.forEach(i=>{c+=[q2(i.n),i.p,i.o,i.a,tot(i),i.l,sal(i)].join(',')+'\n'});c+=`GRAND SALES,,,,,,${grand()}\n`;out(`recon-${date}.csv`,'text/csv',c)}
