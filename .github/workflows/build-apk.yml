
name: Build Android APK

on:
  push:
    branches: [main, app_v1.1, app_v2.0]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      # 3. Install Java
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 4. Install project dependencies
      - name: Install npm dependencies
        run: npm install
      
      # 5. Retrieves encrypted-at-rest GitHub secrets, decodes it and creates the actual .jks into a temporary folder
      - name: Decode Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/recon-release.jks"
          test -s "$RUNNER_TEMP/recon-release.jks"


      # 6. Synchronize Capacitor with Android
      - name: Sync Android project
        run: npx cap sync android

      # 7. Build Android APK   
      - name: Build Debug APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/recon-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug


      # 8. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-recon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
